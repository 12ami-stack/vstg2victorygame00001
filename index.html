<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Power-Up Talkative Shooting Game</title>
    <style>
        body { margin: 0; background-color: #111; color: #fff; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; user-select: none; }
        #game-container { position: relative; box-shadow: 0 0 20px rgba(0, 255, 255, 0.3); }
        canvas { background-color: #050510; display: block; border: 2px solid #333; }
        #dialogue-box { position: absolute; left: 20px; bottom: 75px; background: rgba(0, 0, 0, 0.85); border: 2px solid #00ffcc; border-radius: 8px; padding: 8px 15px; font-size: 14px; color: #00ffcc; max-width: 500px; pointer-events: none; transition: opacity 0.2s; opacity: 0; font-weight: bold; }
        #power-meter { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px; background: rgba(0,0,0,0.5); padding: 5px; border-radius: 4px; }
        .meter-cell { width: 85px; height: 25px; background-color: #222; border: 1px solid #555; color: #888; font-size: 10px; font-weight: bold; display: flex; align-items: center; justify-content: center; flex-direction: column; }
        .meter-cell.active { background-color: #ff9900; color: #000; border-color: #fff; box-shadow: 0 0 5px #ff9900; }
        #instructions { margin-top: 15px; font-size: 13px; color: #aaa; text-align: center; line-height: 1.5; }
        #control-box { position: absolute; top: 15px; right: 20px; display: flex; gap: 10px; }
        .btn-group { display: flex; gap: 3px; background: rgba(0,0,0,0.6); padding: 2px; border-radius: 4px; }
        .ui-btn { background: #333; color: #fff; border: 1px solid #666; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; font-weight: bold; }
        .ui-btn.active { background: #00ffcc; color: #000; border-color: #fff; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="control-box">
        <div class="btn-group" id="lang-box">
            <button class="ui-btn active" onclick="setLang('EN')">EN</button>
            <button class="ui-btn" onclick="setLang('JP')">JP</button>
            <button class="ui-btn" onclick="setLang('DE')">DE</button>
        </div>
        <div class="btn-group" id="voice-box">
            <button class="ui-btn active" onclick="setVoiceGender('M')">M</button>
            <button class="ui-btn" onclick="setVoiceGender('F')">F</button>
        </div>
    </div>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <div id="dialogue-box">Dialogue will appear here</div>
    <div id="power-meter">
        <div class="meter-cell" id="cell-0"><span>1.SPEED</span><span id="lv-0">LV0</span></div>
        <div class="meter-cell" id="cell-1"><span>2.MISSILE</span><span id="lv-1">LV0</span></div>
        <div class="meter-cell" id="cell-2"><span>3.DOUBLE</span><span id="lv-2">LV0</span></div>
        <div class="meter-cell" id="cell-3"><span>4.LASER</span><span id="lv-3">LV0</span></div>
        <div class="meter-cell" id="cell-4"><span>5.OPTION</span><span id="lv-4">LV0</span></div>
        <div class="meter-cell" id="cell-5"><span>6.SHIELD</span><span id="lv-5">LV0</span></div>
        <div class="meter-cell" id="cell-6"><span>7.WIDE</span><span id="lv-6">LV0</span></div>
        <div class="meter-cell" id="cell-7"><span>8.MEGA</span><span id="lv-7">LV0</span></div>
    </div>
</div>
<div id="instructions">【Controls】 Arrow Keys : Move / Space : Shoot / Enter : Power-Up<br><b>The ship only speaks when powering up (Enter key).</b></div>

function getQuote(stage) {
    let currentLv = levels[stage];
    if (currentLv === 0) return "";
    return longQuotes[currentLang].stages[stage * 3 + (currentLv - 1)];
}

function speak(txt) {
    if(!txt) return;
    let prefix = currentLang === 'JP' ? 'System' : currentLang === 'DE' ? 'System' : 'System';
    dialogueBox.innerText = `${prefix}: "${txt}"`; 
    dialogueBox.style.opacity = 1;
    if (dialogueBox.timer) clearTimeout(dialogueBox.timer);
    dialogueBox.timer = setTimeout(() => dialogueBox.style.opacity = 0, 7000);
    
    try {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel(); 
            let u = new SpeechSynthesisUtterance(txt); 
            u.lang = currentLang === 'JP' ? 'ja-JP' : currentLang === 'DE' ? 'de-DE' : 'en-US';
            u.rate = 1.3; 
            // 男性ボイスは低めのピッチ、女性ボイスは高めのピッチに設定
            u.pitch = voiceGender === 'M' ? 0.7 : 1.4; 
            window.speechSynthesis.speak(u);
        }
    } catch (e) {
        console.error("Speech synthesis error:", e);
    }
}

window.setLang = function(lang) {
    currentLang = lang;
    document.querySelectorAll('#lang-box .ui-btn').forEach(btn => {
        if(btn.innerText === lang) btn.classList.add('active');
        else btn.classList.remove('active');
    });
};

window.setVoiceGender = function(gender) {
    voiceGender = gender;
    document.querySelectorAll('#voice-box .ui-btn').forEach(btn => {
        if(btn.innerText === gender) btn.classList.add('active');
        else btn.classList.remove('active');
    });
};

window.addEventListener('keydown', e => { 
    if(e.code === 'Space') e.preventDefault(); 
    keys[e.code] = true; 
    if(e.code === 'Enter') triggerPowerUp(); 
});
window.addEventListener('keyup', e => keys[e.code] = false);

function triggerPowerUp() {
    if (gameOver || currentCapsules === 0) return; 
    let stage = currentCapsules - 1;
    if (levels[stage] >= 3) { 
        speak(longQuotes[currentLang].max); 
        currentCapsules = 0; 
        updatePowerMeter(); 
        return; 
    }
    
    levels[stage]++; 
    let currentLv = levels[stage];
    if (stage === 0) player.speed = 4 + currentLv * 1.5;
    if (stage === 5) player.shield = currentLv * 3;
    
    speak(getQuote(stage));
    currentCapsules = 0; 
    updatePowerMeter();
}

function updatePowerMeter() {
    for(let i=0; i<MAX_STAGES; i++) {
        let cell = document.getElementById(`cell-${i}`);
        let lv = document.getElementById(`lv-${i}`);
        if (cell) {
            if (currentCapsules > 0 && i === currentCapsules - 1) cell.classList.add('active');
            else cell.classList.remove('active');
        }
        if (lv) lv.innerText = `LV${levels[i]}`;
    }
}

function update() {
    if (gameOver) return;
    if (keys['ArrowUp'] && player.y > 0) player.y -= player.speed; 
    if (keys['ArrowDown'] && player.y < canvas.height - player.h) player.y += player.speed; 
    if (keys['ArrowLeft'] && player.x > 0) player.x -= player.speed; 
    if (keys['ArrowRight'] && player.x < canvas.width - player.w) player.x += player.speed;
    
    if (keys['Space'] && Math.random() < 0.15) {
        let isLaser = levels[3] > 0;
        bullets.push({x: player.x + player.w, y: player.y + player.h/2, vx: 10, vy: 0, type: isLaser ? 'laser' : 'normal', lv: levels[3]});
        if(levels[1] > 0 && Math.random() < 0.3) {
            bullets.push({x: player.x + player.w, y: player.y + player.h, vx: 5, vy: 4, type: 'missile'});
            if(levels[1] >= 2) bullets.push({x: player.x, y: player.y + player.h, vx: 4, vy: 4, type: 'missile'});
            if(levels[1] === 3) bullets.push({x: player.x + player.w/2, y: player.y + player.h, vx: 6, vy: 4, type: 'missile'});
        }
        if(levels[2] >= 1) bullets.push({x: player.x + player.w, y: player.y, vx: 9, vy: -3, type: 'normal'});
        if(levels[2] >= 2 && Math.random() < 0.5) bullets.push({x: player.x + player.w - 5, y: player.y, vx: 9, vy: -2.5, type: 'normal'});
        if(levels[2] === 3 && Math.random() < 0.3) bullets.push({x: player.x + player.w - 10, y: player.y, vx: 9, vy: -3.5, type: 'normal'});
        for(let o=0; o<levels[4]; o++) { if(Math.random() < 0.4) bullets.push({x: player.x - 10, y: player.y + player.h + 25 + (o*15), vx: 10, vy: 0, type: 'normal'}); }
        if(levels[6] >= 1) bullets.push({x: player.x + player.w, y: player.y + player.h, vx: 9, vy: 3, type: 'normal'});
        if(levels[6] >= 2 && Math.random() < 0.5) bullets.push({x: player.x + player.w - 5, y: player.y + player.h, vx: 9, vy: 2.5, type: 'normal'});
        if(levels[6] === 3 && Math.random() < 0.3) bullets.push({x: player.x + player.w - 10, y: player.y + player.h, vx: 9, vy: 3.5, type: 'normal'});
        if(levels[7] > 0 && Math.random() < (0.07 * levels[7])) bullets.push({x: player.x + player.w, y: player.y - 50, vx: 12, vy: 0, type: 'mega', lv: levels[7]});
    }
    
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += b.vx; 
        b.y += b.vy; 
        if(b.type === 'missile' && b.y > canvas.height - 10) { b.vy = 0; b.vx = 8; } 
        if(b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
            bullets.splice(i, 1);
        }
    }
    
    if(++spawnTimer % 60 === 0) enemies.push({x: canvas.width, y: Math.random() * (canvas.height - 50) + 10, w: 30, h: 30, hp: 2 + Math.floor(score/2000)});
    
    for (let ei = enemies.length - 1; ei >= 0; ei--) {
        let e = enemies[ei];
        e.x -= 3; 
        if(e.x < -e.w) {
            enemies.splice(ei, 1);
            continue;
        }
        
        if (player.x < e.x + e.w && player.x + player.w > e.x && player.y < e.y + e.h && player.y + player.h > e.y) { 
            enemies.splice(ei, 1); 
            if(player.shield > 0) { 
                player.shield--; 
                if(player.shield===0) levels[5]=0; 
            } else { 
                gameOver = true; 
            } 
            continue;
        }
        
        for (let bi = bullets.length - 1; bi >= 0; bi--) {
            let b = bullets[bi];
            if (!b) continue;
            let bW = b.type==='laser'?(20+b.lv*20):b.type==='mega'?(15+b.lv*10):8, bH = b.type==='laser'?(2+b.lv*2):b.type==='mega'?(10+b.lv*10):4;
            if (b.x < e.x + e.w && b.x + bW > e.x && b.y < e.y + e.h && b.y + bH > e.y) {
                e.hp -= (b.type==='mega' ? b.lv * 3 : b.type==='laser' ? b.lv : 1); 
                if(b.type !== 'laser') bullets.splice(bi, 1);
                if(e.hp <= 0) { 
                    if(Math.random() < 0.4) capsules.push({x: e.x, y: e.y, w: 15, h: 15}); 
                    for(let p=0; p<8; p++) particles.push({x: e.x, y: e.y, vx: (Math.random()-0.5)*6, vy: (Math.random()-0.5)*6, r: 4, alpha: 1}); 
                    enemies.splice(ei, 1); 
                    score += 100; 
                    break;
                }
            }
        }
    }
    
    for (let ci = capsules.length - 1; ci >= 0; ci--) {
        let c = capsules[ci];
        c.x -= 1.5; 
        if (player.x < c.x + c.w && player.x + player.w > c.x && player.y < c.y + c.h && player.y + player.h > c.y) { 
            capsules.splice(ci, 1); 
            currentCapsules = (currentCapsules % MAX_STAGES) + 1; 
            updatePowerMeter(); 
        } else if(c.x < -c.w) {
            capsules.splice(ci, 1); 
        }
    }
    
    for (let pi = particles.length - 1; pi >= 0; pi--) {
        let p = particles[pi];
        p.x += p.vx; 
        p.y += p.vy; 
        p.alpha -= 0.02; 
        if(p.alpha <= 0) particles.splice(pi, 1); 
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height); 
    ctx.fillStyle = "rgba(255,255,255,0.1)"; 
    for(let i=0; i<20; i++) ctx.fillRect((Math.sin(i + Date.now()/1000) * 400) + 400, (i * 20) % canvas.height, 2, 2);
    
    ctx.fillStyle = "#00ffcc"; ctx.fillRect(player.x, player.y, player.w, player.h); 
    ctx.fillStyle = "#fff"; ctx.fillRect(player.x + 20, player.y + 4, 8, 6);
    
    if(player.shield > 0) { 
        ctx.strokeStyle = "rgba(0, 255, 255, " + (0.2 + player.shield*0.15) + ")"; 
        ctx.lineWidth = player.shield; 
        ctx.beginPath(); 
        ctx.arc(player.x + player.w/2, player.y + player.h/2, 22 + player.shield*2, 0, Math.PI*2); 
        ctx.stroke(); 
    }
    
    ctx.fillStyle = "#ff00ff"; 
    for(let o=0; o<levels[4]; o++) { 
        ctx.beginPath(); 
        ctx.arc(player.x - 10, player.y + player.h + 25 + (o*15), 5, 0, Math.PI*2); 
        ctx.fill(); 
    }
    
    bullets.forEach(b => { 
        if(b.type === 'laser') { ctx.fillStyle = "#ff0055"; ctx.fillRect(b.x, b.y - (1+b.lv), 20+b.lv*20, 2+b.lv*2); }
        else if(b.type === 'mega') { ctx.fillStyle = "#ffff00"; ctx.fillRect(b.x, b.y - (5+b.lv*5), 15+b.lv*10, 10+b.lv*10); }
        else if(b.type === 'missile') { ctx.fillStyle = "#ffaa00"; ctx.fillRect(b.x, b.y, 6, 6); }
        else { ctx.fillStyle = "#ffff00"; ctx.fillRect(b.x, b.y - 2, 8, 4); }
    });
    
    enemies.forEach(e => { ctx.fillStyle = "#ff3333"; ctx.fillRect(e.x, e.y, e.w, e.h); ctx.fillStyle = "#111"; ctx.fillRect(e.x + 5, e.y + 8, 6, 6); });
    capsules.forEach(c => { ctx.fillStyle = "#ff0000"; ctx.beginPath(); ctx.arc(c.x + c.w/2, c.y + c.h/2, c.w/2, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = "#fff"; ctx.fillRect(c.x + 4, c.y + 4, 3, 3); });
    particles.forEach(p => { ctx.fillStyle = `rgba(255, 150, 0, ${p.alpha})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill(); });
    
    ctx.fillStyle = "#fff"; ctx.font = "16px Arial"; ctx.fillText(`SCORE: ${score}`, 15, 30);
    
    if (gameOver) { 
        ctx.fillStyle = "rgba(0,0,0,0.8)"; 
        ctx.fillRect(0, 0, canvas.width, canvas.height); 
        ctx.fillStyle = "#ff3333"; 
        ctx.font = "40px Arial"; 
        ctx.textAlign = "center"; 
        ctx.fillText("GAME OVER", canvas.width/2, canvas.height/2); 
        ctx.font = "18px Arial"; 
        ctx.fillStyle = "#fff"; 
        ctx.fillText("Press F5 to Reload and Try Again", canvas.width/2, canvas.height/2 + 50); 
    }
}

function loop() { 
    try {
        update(); 
        draw(); 
    } catch(e) {
        console.error(e);
    }
    requestAnimationFrame(loop); 
}

requestAnimationFrame(loop);
</script>
</body>
</html>
